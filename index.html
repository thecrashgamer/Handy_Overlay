<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phonebox</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: #121212; color: #fff;
         font-family: -apple-system, sans-serif; display: flex; flex-direction: column;
         text-align: center; overflow: hidden; }
  #claude { display: none; flex: none; padding: 10px 12px; font-size: 16px; font-weight: bold; }
  #claude.arbeitet { display: block; background: #f5a623; color: #000; }
  #claude.fertig { display: block; background: #1db954; color: #000; }
  #claude.wartet { display: block; background: #3b82f6; color: #fff; }
  #inhalt { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
            gap: 28px; padding: 8px 20px; }
  #info { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #status { color: #1db954; font-size: 14px; margin-bottom: 8px; }
  #cover { width: min(220px, 62vh); height: min(220px, 62vh); border-radius: 8px;
           object-fit: cover; display: none; flex: none; }
  #titel { font-size: 24px; font-weight: bold; max-width: 340px; }
  #kuenstler { font-size: 18px; color: #b3b3b3; margin-top: 4px; min-height: 22px; }
  #zeitreihe { display: none; align-items: center; gap: 10px; margin-top: 12px; width: 300px;
               font-size: 13px; color: #b3b3b3; }
  #zeitreihe span { width: 38px; font-variant-numeric: tabular-nums; }
  #zeit { flex: 1; min-width: 0; accent-color: #1db954; }
  .tasten { display: flex; gap: 20px; margin-top: 14px; align-items: center; }
  button { width: 68px; height: 68px; border-radius: 50%; border: none;
           background: #282828; color: #fff; font-size: 26px; }
  button:active { background: #1db954; }
  #play { width: 84px; height: 84px; background: #1db954; }
  #lautreihe { display: none; align-items: center; gap: 12px; margin-top: 20px; width: 280px; }
  #laut { flex: 1; accent-color: #1db954; }
  /* Extras: Uhr, Systemanzeige, Shortcut-Tasten */
  #extras { display: none; flex: 1; min-height: 0; align-items: center; justify-content: center;
            gap: 28px; padding: 8px 20px; }
  body.extras #inhalt { display: none; }
  body.extras #extras { display: flex; }
  #system { width: 220px; }
  #uhr { font-size: 56px; font-weight: bold; line-height: 1; }
  #datum { color: #b3b3b3; margin: 6px 0 16px; font-size: 16px; }
  #system { max-height: 100%; overflow-y: auto; }
  .messung .unter { font-size: 11px; color: #777; margin-top: 3px; }
  #akkus { margin-top: 14px; text-align: left; }
  #akkus .titel { font-size: 13px; color: #b3b3b3; margin-bottom: 4px; }
  .akku { margin-top: 7px; font-size: 13px; color: #b3b3b3; }
  .akku .kopf { display: flex; justify-content: space-between; gap: 8px; }
  .akku .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .akku .wert { flex: none; font-variant-numeric: tabular-nums; }
  .akku .balken { height: 6px; margin-top: 3px; }
  .akku .fuell.mittel { background: #f5a623; }
  .akku .fuell.schwach { background: #e5484d; }
  .akku.schwach .wert { color: #ff8a8f; font-weight: bold; }
  /* Niedrige Bildschirme (iPhone quer): kompakter, damit alles ohne Scrollen und ueber den Knoepfen unten Platz hat */
  @media (max-height: 420px) {
    #system { padding-bottom: 48px; }
    #uhr { font-size: 40px; }
    #datum { margin: 2px 0 8px; font-size: 13px; }
    .messung { margin-top: 5px; font-size: 12px; }
    .messung .balken { height: 7px; margin-top: 2px; }
    .messung .unter { font-size: 10px; margin-top: 1px; }
    #akkus { margin-top: 8px; }
    #akkus .titel { font-size: 12px; margin-bottom: 1px; }
    .akku { margin-top: 4px; font-size: 12px; }
    .akku .balken { height: 4px; margin-top: 2px; }
  }
  #blitz { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60; pointer-events: none; opacity: 0; }
  #blitz.an { animation: blitzen .9s ease-out; }
  @keyframes blitzen { 0% { opacity: .0; } 12% { opacity: .55; } 100% { opacity: 0; } }
  #sb-akku { display: none; margin-top: 12px; font-size: 14px; color: #8a4a4a; }
  .messung { text-align: left; margin-top: 10px; font-size: 14px; color: #b3b3b3; }
  .balken { height: 10px; background: #282828; border-radius: 5px; margin-top: 4px; overflow: hidden; }
  .fuell { height: 100%; width: 0; background: #1db954; }
  .fuell.hoch { background: #f5a623; }
  #sc { display: grid; grid-template-columns: repeat(3, 92px); gap: 12px;
        max-height: 100%; overflow-y: auto; padding: 2px; }
  .kachel { width: 92px; height: 80px; border-radius: 14px; font-size: 13px; padding: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .kachel .symbol { font-size: 26px; line-height: 1; }
  .kachel.gesperrt { opacity: .4; }
  .kachel img.bildsymbol { width: 30px; height: 30px; object-fit: contain; }
  button:disabled { opacity: .35; }
  #ohnemusik { display: none; color: #f5a623; font-size: 13px; margin-top: 10px; }
  #keine { color: #b3b3b3; max-width: 280px; }
  #wechsel { position: fixed; right: 10px; bottom: 10px; width: 44px; height: 44px;
             font-size: 20px; background: rgba(40, 40, 40, .9); }
  #konto { position: fixed; left: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%;
           font-size: 20px; background: rgba(40, 40, 40, .9); color: #fff; text-decoration: none;
           display: flex; align-items: center; justify-content: center; }
  #schlaf { position: fixed; left: 64px; bottom: 10px; width: 44px; height: 44px; font-size: 20px;
            background: rgba(40, 40, 40, .9); }
  /* Standby: dunkle Uhr, wenn niemand das Geraet benutzt */
  #standby { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; background: #000;
             flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer;
             color: #6b6b6b; -webkit-tap-highlight-color: transparent; }
  #sb-uhr { font-size: min(26vw, 36vh); font-weight: 200; color: #b5b5b5; line-height: 1; font-variant-numeric: tabular-nums; }
  #sb-datum { font-size: 18px; margin-top: 8px; }
  #sb-musik { display: none; align-items: center; gap: 12px; margin-top: 26px; max-width: 86vw; text-align: left; }
  #sb-cover { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; opacity: .55; flex: none; }
  #sb-cover:not([src]) { display: none; }
  #sb-titel { font-size: 16px; color: #8a8a8a; }
  #sb-kuenstler { font-size: 14px; }
  #sb-claude { display: none; margin-top: 18px; font-size: 15px; }
  #sb-claude .punkt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: #555; }
  #sb-status { font-size: 13px; margin-top: 14px; color: #8a5a2a; min-height: 16px; }
  #hinweis { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
             background: #1db954; color: #000; font-weight: bold; padding: 8px 16px;
             border-radius: 20px; display: none; }
  #hinweis.fehler { background: #e5484d; color: #fff; }
  /* JavaScript-Fehler der Seite: bleibt stehen, bis man draufTippt */
  #jsfehler { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20;
              background: #e5484d; color: #fff; font-size: 14px; font-weight: bold;
              padding: 8px 12px; text-align: left; white-space: pre-wrap; word-break: break-word;
              max-height: 40vh; overflow-y: auto; }
  /* Claude-Ansicht: woran Claude gerade arbeitet */
  #claudeview { display: none; flex: 1; min-height: 0; align-items: center; justify-content: center;
                gap: 28px; padding: 8px 20px; }
  body.claudeansicht #inhalt, body.claudeansicht #extras { display: none; }
  body.claudeansicht #claudeview { display: flex; }
  body.claudeansicht #claude { display: none !important; }
  #cl-haupt { width: 270px; }
  #cl-projekt { color: #b3b3b3; font-size: 14px; min-height: 18px; }
  #cl-status { font-size: 26px; font-weight: bold; margin-top: 6px; display: flex;
               align-items: center; justify-content: center; gap: 10px; }
  #cl-punkt { width: 14px; height: 14px; border-radius: 50%; background: #555; flex: none; }
  #claudeview.arbeitet #cl-punkt { background: #f5a623; animation: puls 1.2s infinite; }
  #claudeview.fertig #cl-punkt { background: #1db954; }
  #claudeview.wartet #cl-punkt { background: #3b82f6; animation: puls 1.2s infinite; }
  @keyframes puls { 50% { opacity: .3; } }
  #cl-zeit { font-size: 15px; color: #b3b3b3; margin-top: 4px; min-height: 20px;
             font-variant-numeric: tabular-nums; }
  #cl-aktion { font-size: 20px; margin-top: 14px; min-height: 52px; word-break: break-word; }
  #cl-eingabe { margin-top: 14px; text-align: left; }
  #cl-text { width: 100%; box-sizing: border-box; background: #1c1c1c; color: #fff; border: 1px solid #333; border-radius: 10px;
             padding: 10px; font-size: 16px; font-family: inherit; resize: none; }
  #cl-text:focus { outline: 2px solid #1db954; border-color: transparent; }
  #cl-senden { margin-top: 8px; width: 100%; height: 44px; border-radius: 10px; background: #1db954; color: #000; font-size: 16px;
               font-weight: bold; }
  #cl-senden:disabled { background: #2a2a2a; color: #777; }
  #cl-antwort { margin-bottom: 10px; padding: 8px 10px; background: #1b1b1b; border-radius: 8px; text-align: left; }
  #cl-antwort-kopf { font-size: 12px; color: #7ee2a0; margin-bottom: 4px; }
  #cl-antwort-text { font-size: 14px; color: #ddd; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #cl-nutzung { margin: 10px auto 0; width: 100%; max-width: 360px; text-align: left; }
  #cl-nutzung .nz { margin-top: 6px; font-size: 12px; color: #b3b3b3; }
  #cl-nutzung .nz-kopf { display: flex; justify-content: space-between; gap: 8px; }
  #cl-nutzung .nz-balken { height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  #cl-nutzung .nz-fuell { height: 100%; background: #1db954; border-radius: 3px; }
  #cl-nutzung .nz-fuell.mittel { background: #f5a623; }
  #cl-nutzung .nz-fuell.hoch { background: #ff5a5f; }
  #cl-efehler { color: #ff8a8f; font-size: 13px; margin-top: 6px; min-height: 16px; }
  #cl-eliste { margin-top: 8px; font-size: 13px; color: #b3b3b3; }
  #cl-eliste .zeile { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid #262626; }
  #cl-eliste .text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cl-eliste .zustand { flex: none; font-size: 12px; }
  #cl-eliste .zustand.wartet { color: #f5a623; }
  #cl-eliste .zustand.uebergeben { color: #7ee2a0; }
  #cl-eliste button { height: auto; width: auto; border-radius: 6px; padding: 2px 8px; font-size: 12px; background: #333; }
  #cl-verlauf { list-style: none; margin: 0; padding: 0; width: 300px; text-align: left;
                font-size: 14px; color: #b3b3b3; max-height: 100%; overflow: hidden; }
  #cl-verlauf li { padding: 6px 0; border-bottom: 1px solid #282828; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
  #cl-verlauf li:first-child { color: #fff; }
  #cl-verlauf .uhr { color: #777; margin-right: 8px; font-variant-numeric: tabular-nums; }
  #claude { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Rueckfrage (z. B. vor dem Herunterfahren) */
  #rueckfrage { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
                background: rgba(0, 0, 0, .88); align-items: center; justify-content: center;
                flex-direction: column; padding: 20px; }
  #rf-icon { font-size: 44px; line-height: 1; }
  #rf-frage { font-size: 22px; font-weight: bold; margin-top: 10px; max-width: 420px; }
  #rf-zeit { color: #b3b3b3; font-size: 14px; margin-top: 6px; }
  #rf-tasten { display: flex; gap: 40px; margin-top: 20px; }
  #rf-tasten button { width: 150px; height: 60px; border-radius: 30px; font-size: 18px; font-weight: bold; }
  #rf-nein { background: #3a3a3a; }
  #rf-ja { background: #e5484d; }
  #rf-ja:active { background: #b3262c; }
  /* Hochformat: alles untereinander */
  @media (orientation: portrait) {
    #inhalt { flex-direction: column; gap: 16px; }
    #cover { width: 200px; height: 200px; }
    button { width: 80px; height: 80px; font-size: 30px; }
    #play { width: 100px; height: 100px; }
    .tasten { gap: 24px; margin-top: 24px; }
    #lautreihe { margin-top: 28px; }
    #extras { flex-direction: column; gap: 20px; }
    #system { text-align: center; }
    #claudeview { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>
  <div id="claude"></div>
  <div id="inhalt">
    <img id="cover" alt="">
    <div id="info">
      <div id="status">Verbinde ...</div>
      <div id="titel">-</div>
      <div id="kuenstler"></div>
      <div id="zeitreihe">
        <span id="pos">0:00</span>
        <input id="zeit" type="range" min="0" max="1" step="1" value="0">
        <span id="dauer">0:00</span>
      </div>
      <div class="tasten">
        <button id="zurueck" onclick="senden('zurueck')">&#9198;</button>
        <button id="play" onclick="senden('playpause')">&#9654;</button>
        <button id="weiter" onclick="senden('weiter')">&#9197;</button>
      </div>
      <div id="ohnemusik">Die Musiksteuerung ist für dein Konto abgeschaltet.</div>
      <div id="lautreihe">
        <span>&#128265;</span>
        <input id="laut" type="range" min="0" max="100" step="1">
        <span>&#128266;</span>
      </div>
    </div>
  </div>
  <div id="extras">
    <div id="system">
      <div id="uhr">--:--</div>
      <div id="datum"></div>
      <div class="messung"><span id="cputext">CPU</span><div class="balken"><div class="fuell" id="cpu"></div></div></div>
      <div class="messung"><span id="ramtext">RAM</span><div class="balken"><div class="fuell" id="ram"></div></div></div>
      <div id="gpus"></div>
      <div id="akkus" hidden><div class="titel">Akkus</div><div id="akkuliste"></div></div>
    </div>
    <div id="sc"></div>
  </div>
  <div id="claudeview">
    <div id="cl-haupt">
      <div id="cl-projekt"></div>
      <div id="cl-status"><span id="cl-punkt"></span><span id="cl-titel">Claude</span></div>
      <div id="cl-zeit"></div>
      <div id="cl-aktion"></div>
      <div id="cl-nutzung" hidden></div>
      <div id="cl-eingabe" hidden>
        <div id="cl-antwort" hidden><div id="cl-antwort-kopf"></div><div id="cl-antwort-text"></div></div>
        <textarea id="cl-text" rows="2" maxlength="2000" placeholder="Anweisung an Claude ..." enterkeyhint="send"></textarea>
        <button id="cl-senden" onclick="claudeSenden()">An Claude senden</button>
        <div id="cl-efehler" role="alert"></div>
        <div class="hinweis" style="font-size:12px;color:#777;margin-top:6px">Claude holt die Anweisung ab, sobald er den nächsten Schritt macht. Ist er fertig, wartet er noch bis zu 9 Minuten darauf; danach kommt sie erst, wenn du am PC etwas eingibst.</div>
        <div id="cl-eliste"></div>
      </div>
    </div>
    <ul id="cl-verlauf"></ul>
  </div>
  <a id="konto" href="/konto" title="Konto">&#128100;</a>
  <button id="schlaf" onclick="standbyEin()" title="Standby">&#127769;</button>
  <button id="wechsel" onclick="ansichtWechseln()">&#9638;</button>
  <div id="hinweis"></div>
  <div id="blitz"></div>
  <div id="standby">
    <div id="sb-uhr">--:--</div>
    <div id="sb-datum"></div>
    <div id="sb-musik"><img id="sb-cover" alt=""><div><div id="sb-titel"></div><div id="sb-kuenstler"></div></div></div>
    <div id="sb-akku"></div>
    <div id="sb-claude"><span class="punkt"></span><span id="sb-claude-text"></span></div>
    <div id="sb-status"></div>
  </div>
  <div id="jsfehler" onclick="this.style.display='none'"></div>
  <div id="rueckfrage">
    <div id="rf-icon"></div>
    <div id="rf-frage"></div>
    <div id="rf-zeit"></div>
    <div id="rf-tasten">
      <button id="rf-nein" onclick="rueckfrageAntwort(false)">Abbrechen</button>
      <button id="rf-ja" onclick="rueckfrageAntwort(true)">Ja</button>
    </div>
  </div>
<script>
  // JavaScript-Fehler nie verschlucken: als rote Leiste oben auf der Seite zeigen
  var jsFehlerListe = [];
  function jsFehlerZeigen(text) {
    try {
      text = String(text);
      if (jsFehlerListe.indexOf(text) < 0) jsFehlerListe.push(text);  // gleicher Fehler nur einmal
      jsFehlerListe = jsFehlerListe.slice(-3);  // die letzten drei reichen
      var f = document.getElementById("jsfehler");
      if (!f) return;
      f.textContent = "Fehler in der Seite: " + jsFehlerListe.join("\n");
      f.style.display = "block";
    } catch (e) {}
  }
  window.onerror = function (meldung, quelle, zeile, spalte, fehler) {
    var text = (fehler && fehler.message) || meldung || "unbekannter Fehler";
    jsFehlerZeigen(text + (zeile ? " (Zeile " + zeile + ")" : ""));
  };
  window.addEventListener("unhandledrejection", function (e) {
    var g = e && e.reason;
    jsFehlerZeigen("Promise: " + ((g && g.message) || g || "unbekannt"));
  });
  // Fuehrt einen Teil der Anzeige aus; ein Fehler darin legt die anderen Teile nicht lahm
  function teil(name, f) {
    try { f(); } catch (e) {
      jsFehlerZeigen(name + ": " + (e && e.message ? e.message : e));
      if (window.console) console.error(name, e);
    }
  }

  var ws;
  var SEITE = "v31";  // Version dieser Seite; der Server meldet seine eigene
  var letzteEingabe = 0;
  var letztesSenden = 0;
  var basisPos = 0, basisZeit = 0, liedDauer = 0, laeuft = false;
  var suchenBis = 0, zieht = false;
  var scStand = "";
  var letzteShortcutNr = null;
  var hinweisTimer;
  var CLAUDE_TEXT = { arbeitet: "Claude arbeitet ...", fertig: "Claude ist fertig", wartet: "Claude braucht dich" };

  function el(id) { return document.getElementById(id); }

  function anmeldungPruefen() {
    fetch("/api/ich", { credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) { location.href = "/anmelden"; return null; }
      return r.ok ? r.json() : null;
    }).then(function (j) {
      if (j && j.name) el("konto").title = "Konto: " + j.name;
    }).catch(function () {});  // Server nicht erreichbar: nichts tun, es wird neu verbunden
  }

  function verbinden() {
    // Die Seite nennt dem Server ihre Version, damit er eine alte Seite im Protokoll meldet
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?seite=" + SEITE);
    ws.onopen = function () {
      verbunden = true;
      el("status").textContent = "Verbunden";
    };
    ws.onmessage = function (e) {
      var d;
      try { d = JSON.parse(e.data); } catch (f) { jsFehlerZeigen("Nachricht unlesbar: " + f.message); return; }
      if (!d || typeof d !== "object") return;
      letzteNachricht = d;
      if (d.fehler) { hinweisZeigen("Server-Fehler: " + d.fehler, true); return; }
      var neuLaden = false;
      teil("Version", function () {
        el("status").textContent = "Verbunden" + (d.version ? " \u00B7 " + d.version : "");
        if (d.version && String(d.version).split(" ")[0] !== SEITE) {
          // Seite und Server passen nicht zusammen: einmal frisch laden
          var schon = false;
          try { schon = sessionStorage.getItem("phonebox-neu") === d.version; sessionStorage.setItem("phonebox-neu", d.version); } catch (e) {}
          if (!schon) { neuLaden = true; return; }
          el("status").textContent = "Seite " + SEITE + " passt nicht zum Server " + String(d.version).split(" ")[0] + " \u2013 Seite neu laden";
        }
      });
      if (neuLaden) { location.reload(); return; }
      // Die Rueckfrage zuerst: sie darf nie an einem Fehler in einem anderen Teil scheitern
      teil("R\u00FCckfrage", function () { rueckfrageZeigen(d.rueckfrage); });
      teil("Musik", function () { musikZeigen(d); });
      teil("Extras", function () { extrasZeigen(d); });
      teil("Zeitleiste", function () { zeitUebernehmen(d); });
      teil("Rechte", function () { rechteZeigen(d.rechte); });
      teil("Claude", function () { claudeZeigen(d.claude || {}); });
      teil("Claude-Nutzung", function () { claudeNutzungZeigen(d.claude_nutzung); });
      teil("Claude-Eingabe", function () { claudeEingabeZeigen(d.claude_eingabe || {}); });
    };
    ws.onclose = function () {
      verbunden = false;
      el("status").textContent = "Warte auf PC ...";
      anmeldungPruefen();  // abgelaufene Sitzung: zur Anmeldung statt endlos neu zu verbinden

    if (einst === "aus") return;
    var blitz = el("blitz");
    blitz.style.background = art === "fertig" ? "#1db954" : "#3b82f6";
    blitz.classList.remove("an");
    void blitz.offsetWidth;  // Animation neu starten
    blitz.classList.add("an");
    try { if (navigator.vibrate) navigator.vibrate(art === "fertig" ? [120, 60, 180] : [100, 60, 100, 60, 100]); } catch (e) {}
    if (einst !== "ton" || !audio) return;
    try {
      var t = audio.currentTime + 0.02;
      SIGNAL_TOENE[art].forEach(function (n) {
        if (n[0] > 0) {
          var o = audio.createOscillator(), g = audio.createGain();
          o.type = "sine";
          o.frequency.value = n[0];
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.3, t + 0.015);  // weich ein- und ausblenden: kein Knacken
          g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] / 1000);
          o.connect(g);
          g.connect(audio.destination);
          o.start(t);
          o.stop(t + n[1] / 1000 + 0.02);
        }
        t += n[1] / 1000;
      });
    } catch (e) {}
  }

  // ---- Standby
  var letzteAktion = Date.now(), standbyAn = false, letzteNachricht = null, verbunden = false, claudeVorher = "", claudeInit = false;
  var audio = null;
  var sbCoverId = "";

  function standbySekunden() {
    try {
      var test = localStorage.getItem("phonebox-standby-sek");  // nur fuer Tests
      if (test !== null) return Number(test) || 0;
      var m = localStorage.getItem("phonebox-standby");
      return (m === null ? 10 : Number(m) || 0) * 60;  // Standard: nach 10 Minuten
    } catch (e) { return 600; }
  }

  function standbyEin() {
    standbyAn = true;
    el("standby").style.display = "flex";
    standbyAktualisieren();
  }

  function standbyAus() {
    standbyAn = false;
    el("standby").style.display = "none";
    letzteAktion = Date.now();
  }

  function standbyAktualisieren() {
    var jetzt = new Date();
    el("sb-uhr").textContent = jetzt.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    el("sb-datum").textContent = jetzt.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
    var d = letzteNachricht || {};
    var musik = el("sb-musik");
    if (d.spielt && d.titel) {
      musik.style.display = "flex";
      el("sb-titel").textContent = d.titel;
      el("sb-kuenstler").textContent = d.kuenstler || "";
      var cover = el("sb-cover");
      if (d.cover && d.cover !== sbCoverId) { sbCoverId = d.cover; cover.src = "/cover?id=" + d.cover; }
      if (!d.cover) { sbCoverId = ""; cover.removeAttribute("src"); }
    } else {
      musik.style.display = "none";
    }
    var c = d.claude || {}, box = el("sb-claude");
    if (c.status) {
      var farben = { arbeitet: "#a56d12", fertig: "#14803a", wartet: "#2f5fa8" };
      box.style.display = "block";
      box.querySelector(".punkt").style.background = farben[c.status] || "#555";
      el("sb-claude-text").textContent = (CLAUDE_TITEL[c.status] || "Claude") + (c.status === "arbeitet" && c.aktion ? ": " + c.aktion : "");
    } else {
      box.style.display = "none";
    }
    var schwach = (((d.system || {}).akkus) || []).filter(function (a) { return a.prozent != null && a.prozent <= 15 && !a.laedt; });
    el("sb-akku").style.display = schwach.length ? "block" : "none";
    el("sb-akku").textContent = schwach.map(function (a) { return "\uD83D\uDD0B " + a.name + " " + a.prozent + " %"; }).join("   ");
    el("sb-status").textContent = verbunden ? "" : "Warte auf PC ...";
  }

  ["touchstart", "mousedown", "pointerdown", "wheel"].forEach(function (name) {
    document.addEventListener(name, function () { if (!standbyAn) letzteAktion = Date.now(); }, true);
  });
  document.addEventListener("keydown", function (ev) {
    if (standbyAn) { ev.preventDefault(); standbyAus(); } else letzteAktion = Date.now();
  }, true);
  // Aufwecken beim "click": der erste Tipp trifft noch die dunkle Flaeche und nichts darunter
  el("standby").addEventListener("click", function (ev) { ev.stopPropagation(); standbyAus(); });
  setInterval(function () {
    var sek = standbySekunden();
    if (rueckfrageNr !== null) letzteAktion = Date.now();  // waehrend einer Rueckfrage nie einschlafen
    if (!standbyAn && sek > 0 && Date.now() - letzteAktion > sek * 1000) standbyEin();
    if (standbyAn) standbyAktualisieren();
  }, 1000);

  anmeldungPruefen();
  verbinden();
</script>
</body>
</html>
