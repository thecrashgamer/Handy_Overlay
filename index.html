<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phonebox</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: #121212; color: #fff;
         font-family: -apple-system, sans-serif; display: flex; flex-direction: column;
         text-align: center; overflow: hidden; }
  #claude { display: none; flex: none; padding: 10px 12px; font-size: 16px; font-weight: bold; }
  #claude.arbeitet { display: block; background: #f5a623; color: #000; }
  #claude.fertig { display: block; background: #1db954; color: #000; }
  #claude.wartet { display: block; background: #3b82f6; color: #fff; }
  #inhalt { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
            gap: 28px; padding: 8px 20px; }
  #info { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #status { color: #1db954; font-size: 14px; margin-bottom: 8px; }
  #cover { width: min(220px, 62vh); height: min(220px, 62vh); border-radius: 8px;
           object-fit: cover; display: none; flex: none; }
  #titel { font-size: 24px; font-weight: bold; max-width: 340px; }
  #kuenstler { font-size: 18px; color: #b3b3b3; margin-top: 4px; min-height: 22px; }
  #zeitreihe { display: none; align-items: center; gap: 10px; margin-top: 12px; width: 300px;
               font-size: 13px; color: #b3b3b3; }
  #zeitreihe span { width: 38px; font-variant-numeric: tabular-nums; }
  #zeit { flex: 1; min-width: 0; accent-color: #1db954; }
  .tasten { display: flex; gap: 20px; margin-top: 14px; align-items: center; }
  button { width: 68px; height: 68px; border-radius: 50%; border: none;
           background: #282828; color: #fff; font-size: 26px; }
  button:active { background: #1db954; }
  #play { width: 84px; height: 84px; background: #1db954; }
  #lautreihe { display: none; align-items: center; gap: 12px; margin-top: 20px; width: 280px; }
  #laut { flex: 1; accent-color: #1db954; }
  /* Extras: Uhr, Systemanzeige, Shortcut-Tasten */
  #extras { display: none; flex: 1; min-height: 0; align-items: center; justify-content: center;
            gap: 28px; padding: 8px 20px; }
  body.extras #inhalt { display: none; }
  body.extras #extras { display: flex; }
  #system { width: 220px; }
  #uhr { font-size: 56px; font-weight: bold; line-height: 1; }
  #datum { color: #b3b3b3; margin: 6px 0 16px; font-size: 16px; }
  .messung { text-align: left; margin-top: 10px; font-size: 14px; color: #b3b3b3; }
  .balken { height: 10px; background: #282828; border-radius: 5px; margin-top: 4px; overflow: hidden; }
  .fuell { height: 100%; width: 0; background: #1db954; }
  .fuell.hoch { background: #f5a623; }
  #sc { display: grid; grid-template-columns: repeat(3, 92px); gap: 12px;
        max-height: 100%; overflow-y: auto; padding: 2px; }
  .kachel { width: 92px; height: 80px; border-radius: 14px; font-size: 13px; padding: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .kachel .symbol { font-size: 26px; line-height: 1; }
  #keine { color: #b3b3b3; max-width: 280px; }
  #wechsel { position: fixed; right: 10px; bottom: 10px; width: 44px; height: 44px;
             font-size: 20px; background: rgba(40, 40, 40, .9); }
  #konto { position: fixed; left: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%;
           font-size: 20px; background: rgba(40, 40, 40, .9); color: #fff; text-decoration: none;
           display: flex; align-items: center; justify-content: center; }
  #hinweis { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
             background: #1db954; color: #000; font-weight: bold; padding: 8px 16px;
             border-radius: 20px; display: none; }
  #hinweis.fehler { background: #e5484d; color: #fff; }
  /* JavaScript-Fehler der Seite: bleibt stehen, bis man draufTippt */
  #jsfehler { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20;
              background: #e5484d; color: #fff; font-size: 14px; font-weight: bold;
              padding: 8px 12px; text-align: left; white-space: pre-wrap; word-break: break-word;
              max-height: 40vh; overflow-y: auto; }
  /* Claude-Ansicht: woran Claude gerade arbeitet */
  #claudeview { display: none; flex: 1; min-height: 0; align-items: center; justify-content: center;
                gap: 28px; padding: 8px 20px; }
  body.claudeansicht #inhalt, body.claudeansicht #extras { display: none; }
  body.claudeansicht #claudeview { display: flex; }
  body.claudeansicht #claude { display: none !important; }
  #cl-haupt { width: 270px; }
  #cl-projekt { color: #b3b3b3; font-size: 14px; min-height: 18px; }
  #cl-status { font-size: 26px; font-weight: bold; margin-top: 6px; display: flex;
               align-items: center; justify-content: center; gap: 10px; }
  #cl-punkt { width: 14px; height: 14px; border-radius: 50%; background: #555; flex: none; }
  #claudeview.arbeitet #cl-punkt { background: #f5a623; animation: puls 1.2s infinite; }
  #claudeview.fertig #cl-punkt { background: #1db954; }
  #claudeview.wartet #cl-punkt { background: #3b82f6; animation: puls 1.2s infinite; }
  @keyframes puls { 50% { opacity: .3; } }
  #cl-zeit { font-size: 15px; color: #b3b3b3; margin-top: 4px; min-height: 20px;
             font-variant-numeric: tabular-nums; }
  #cl-aktion { font-size: 20px; margin-top: 14px; min-height: 52px; word-break: break-word; }
  #cl-verlauf { list-style: none; margin: 0; padding: 0; width: 300px; text-align: left;
                font-size: 14px; color: #b3b3b3; max-height: 100%; overflow: hidden; }
  #cl-verlauf li { padding: 6px 0; border-bottom: 1px solid #282828; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
  #cl-verlauf li:first-child { color: #fff; }
  #cl-verlauf .uhr { color: #777; margin-right: 8px; font-variant-numeric: tabular-nums; }
  #claude { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Rueckfrage (z. B. vor dem Herunterfahren) */
  #rueckfrage { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
                background: rgba(0, 0, 0, .88); align-items: center; justify-content: center;
                flex-direction: column; padding: 20px; }
  #rf-icon { font-size: 44px; line-height: 1; }
  #rf-frage { font-size: 22px; font-weight: bold; margin-top: 10px; max-width: 420px; }
  #rf-zeit { color: #b3b3b3; font-size: 14px; margin-top: 6px; }
  #rf-tasten { display: flex; gap: 40px; margin-top: 20px; }
  #rf-tasten button { width: 150px; height: 60px; border-radius: 30px; font-size: 18px; font-weight: bold; }
  #rf-nein { background: #3a3a3a; }
  #rf-ja { background: #e5484d; }
  #rf-ja:active { background: #b3262c; }
  /* Hochformat: alles untereinander */
  @media (orientation: portrait) {
    #inhalt { flex-direction: column; gap: 16px; }
    #cover { width: 200px; height: 200px; }
    button { width: 80px; height: 80px; font-size: 30px; }
    #play { width: 100px; height: 100px; }
    .tasten { gap: 24px; margin-top: 24px; }
    #lautreihe { margin-top: 28px; }
    #extras { flex-direction: column; gap: 20px; }
    #system { text-align: center; }
    #claudeview { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>
  <div id="claude"></div>
  <div id="inhalt">
    <img id="cover" alt="">
    <div id="info">
      <div id="status">Verbinde ...</div>
      <div id="titel">-</div>
      <div id="kuenstler"></div>
      <div id="zeitreihe">
        <span id="pos">0:00</span>
        <input id="zeit" type="range" min="0" max="1" step="1" value="0">
        <span id="dauer">0:00</span>
      </div>
      <div class="tasten">
        <button id="zurueck" onclick="senden('zurueck')">&#9198;</button>
        <button id="play" onclick="senden('playpause')">&#9654;</button>
        <button id="weiter" onclick="senden('weiter')">&#9197;</button>
      </div>
      <div id="lautreihe">
        <span>&#128265;</span>
        <input id="laut" type="range" min="0" max="100" step="1">
        <span>&#128266;</span>
      </div>
    </div>
  </div>
  <div id="extras">
    <div id="system">
      <div id="uhr">--:--</div>
      <div id="datum"></div>
      <div class="messung"><span id="cputext">CPU</span><div class="balken"><div class="fuell" id="cpu"></div></div></div>
      <div class="messung"><span id="ramtext">RAM</span><div class="balken"><div class="fuell" id="ram"></div></div></div>
    </div>
    <div id="sc"></div>
  </div>
  <div id="claudeview">
    <div id="cl-haupt">
      <div id="cl-projekt"></div>
      <div id="cl-status"><span id="cl-punkt"></span><span id="cl-titel">Claude</span></div>
      <div id="cl-zeit"></div>
      <div id="cl-aktion"></div>
    </div>
    <ul id="cl-verlauf"></ul>
  </div>
  <a id="konto" href="/konto" title="Konto">&#128100;</a>
  <button id="wechsel" onclick="ansichtWechseln()">&#9638;</button>
  <div id="hinweis"></div>
  <div id="jsfehler" onclick="this.style.display='none'"></div>
  <div id="rueckfrage">
    <div id="rf-icon"></div>
    <div id="rf-frage"></div>
    <div id="rf-zeit"></div>
    <div id="rf-tasten">
      <button id="rf-nein" onclick="rueckfrageAntwort(false)">Abbrechen</button>
      <button id="rf-ja" onclick="rueckfrageAntwort(true)">Ja</button>
    </div>
  </div>
<script>
  // JavaScript-Fehler nie verschlucken: als rote Leiste oben auf der Seite zeigen
  var jsFehlerListe = [];
  function jsFehlerZeigen(text) {
    try {
      text = String(text);
      if (jsFehlerListe.indexOf(text) < 0) jsFehlerListe.push(text);  // gleicher Fehler nur einmal
      jsFehlerListe = jsFehlerListe.slice(-3);  // die letzten drei reichen
      var f = document.getElementById("jsfehler");
      if (!f) return;
      f.textContent = "Fehler in der Seite: " + jsFehlerListe.join("\n");
      f.style.display = "block";
    } catch (e) {}
  }
  window.onerror = function (meldung, quelle, zeile, spalte, fehler) {
    var text = (fehler && fehler.message) || meldung || "unbekannter Fehler";
    jsFehlerZeigen(text + (zeile ? " (Zeile " + zeile + ")" : ""));
  };
  window.addEventListener("unhandledrejection", function (e) {
    var g = e && e.reason;
    jsFehlerZeigen("Promise: " + ((g && g.message) || g || "unbekannt"));
  });
  // Fuehrt einen Teil der Anzeige aus; ein Fehler darin legt die anderen Teile nicht lahm
  function teil(name, f) {
    try { f(); } catch (e) {
      jsFehlerZeigen(name + ": " + (e && e.message ? e.message : e));
      if (window.console) console.error(name, e);
    }
  }

  var ws;
  var SEITE = "v14";  // Version dieser Seite; der Server meldet seine eigene
  var letzteEingabe = 0;
  var letztesSenden = 0;
  var basisPos = 0, basisZeit = 0, liedDauer = 0, laeuft = false;
  var suchenBis = 0, zieht = false;
  var scStand = "";
  var letzteShortcutNr = null;
  var hinweisTimer;
  var CLAUDE_TEXT = { arbeitet: "Claude arbeitet ...", fertig: "Claude ist fertig", wartet: "Claude braucht dich" };

  function el(id) { return document.getElementById(id); }

  function anmeldungPruefen() {
    fetch("/api/ich", { credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) { location.href = "/anmelden"; return null; }
      return r.ok ? r.json() : null;
    }).then(function (j) {
      if (j && j.name) el("konto").title = "Konto: " + j.name;
    }).catch(function () {});  // Server nicht erreichbar: nichts tun, es wird neu verbunden
  }

  function verbinden() {
    // Die Seite nennt dem Server ihre Version, damit er eine alte Seite im Protokoll meldet
    ws = new WebSocket("ws://" + location.host + "/ws?seite=" + SEITE);
    ws.onopen = function () {
      el("status").textContent = "Verbunden";
    };
    ws.onmessage = function (e) {
      var d;
      try { d = JSON.parse(e.data); } catch (f) { jsFehlerZeigen("Nachricht unlesbar: " + f.message); return; }
      if (!d || typeof d !== "object") return;
      if (d.fehler) { hinweisZeigen("Server-Fehler: " + d.fehler, true); return; }
      var neuLaden = false;
      teil("Version", function () {
        el("status").textContent = "Verbunden" + (d.version ? " \u00B7 " + d.version : "");
        if (d.version && String(d.version).split(" ")[0] !== SEITE) {
          // Seite und Server passen nicht zusammen: einmal frisch laden
          var schon = false;
          try { schon = sessionStorage.getItem("phonebox-neu") === d.version; sessionStorage.setItem("phonebox-neu", d.version); } catch (e) {}
          if (!schon) { neuLaden = true; return; }
          el("status").textContent = "Seite " + SEITE + " passt nicht zum Server " + String(d.version).split(" ")[0] + " \u2013 Seite neu laden";
        }
      });
      if (neuLaden) { location.reload(); return; }
      // Die Rueckfrage zuerst: sie darf nie an einem Fehler in einem anderen Teil scheitern
      teil("R\u00FCckfrage", function () { rueckfrageZeigen(d.rueckfrage); });
      teil("Musik", function () { musikZeigen(d); });
      teil("Extras", function () { extrasZeigen(d); });
      teil("Zeitleiste", function () { zeitUebernehmen(d); });
      teil("Claude", function () { claudeZeigen(d.claude || {}); });
    };
    ws.onclose = function () {
      el("status").textContent = "Warte auf PC ...";
      anmeldungPruefen();  // abgelaufene Sitzung: zur Anmeldung statt endlos neu zu verbinden
      setTimeout(verbinden, 3000);
    };
  }

  function musikZeigen(d) {
    el("titel").textContent = d.titel || "-";
    el("kuenstler").textContent = d.kuenstler || "";
    el("play").innerHTML = d.spielt ? "&#9208;" : "&#9654;";

    var cover = el("cover");
    if (d.cover) {
      var neu = "/cover?id=" + d.cover;
      if (cover.getAttribute("src") !== neu) cover.src = neu;
      cover.style.display = "block";
    } else {
      cover.style.display = "none";
      cover.removeAttribute("src");
    }

    var reihe = el("lautreihe");
    if (d.laut === null || d.laut === undefined) {
      reihe.style.display = "none";
    } else {
      reihe.style.display = "flex";
      // Eigene Eingabe nicht sofort ueberschreiben
      if (Date.now() - letzteEingabe > 1500) el("laut").value = d.laut;
    }
  }

  function extrasZeigen(d) {
    var sys = d.system || {};
    if (typeof sys.cpu === "number") {
      el("cputext").textContent = "CPU " + sys.cpu + " %";
      el("cpu").style.width = sys.cpu + "%";
      el("cpu").className = "fuell" + (sys.cpu > 85 ? " hoch" : "");
      el("ramtext").textContent = "RAM " + sys.ram + " %";
      el("ram").style.width = sys.ram + "%";
      el("ram").className = "fuell" + (sys.ram > 85 ? " hoch" : "");
    }

    var liste = d.shortcuts || [];
    var stand = JSON.stringify(liste);
    if (stand !== scStand) {  // Kacheln nur neu bauen, wenn sich die Liste aendert
      scStand = stand;
      var feld = el("sc");
      feld.textContent = "";
      if (liste.length === 0) {
        var leer = document.createElement("div");
        leer.id = "keine";
        leer.textContent = "Keine Shortcuts. Trage welche in shortcuts.json am PC ein.";
        feld.appendChild(leer);
      }
      liste.forEach(function (eintrag, i) {
        var b = document.createElement("button");
        b.className = "kachel";
        var symbol = document.createElement("span");
        symbol.className = "symbol";
        symbol.textContent = eintrag.icon || "\u25B6";
        var name = document.createElement("span");
        name.textContent = eintrag.name;
        b.appendChild(symbol);
        b.appendChild(name);
        b.onclick = function () {
          if (!ws || ws.readyState !== 1) { hinweisZeigen("Keine Verbindung zum PC", true); return; }
          hinweisZeigen(eintrag.name + " ...", false);  // sofortige Rueckmeldung: der Tipp ist angekommen
          senden("shortcut:" + i);
        };
        feld.appendChild(b);
      });
    }

    var sc = d.shortcut || {};
    if (letzteShortcutNr !== null && sc.nr !== letzteShortcutNr && sc.name) {
      hinweisZeigen(sc.ok ? (sc.text || sc.name + " ausgel\u00F6st") : sc.name + " hat nicht geklappt", !sc.ok);
    }
    letzteShortcutNr = sc.nr;
  }

  function format(sekunden) {
    sekunden = Math.max(0, Math.floor(sekunden));
    var s = sekunden % 60;
    return Math.floor(sekunden / 60) + ":" + (s < 10 ? "0" : "") + s;
  }

  function zeitUebernehmen(d) {
    liedDauer = d.dauer || 0;
    laeuft = !!d.spielt;
    el("zeitreihe").style.display = liedDauer > 0 ? "flex" : "none";
    if (Date.now() < suchenBis) return;  // eigene Eingabe nicht sofort ueberschreiben
    basisPos = d.position || 0;
    basisZeit = Date.now();
  }

  function zeitAnzeigen() {
    if (liedDauer <= 0 || zieht) return;
    var pos = basisPos + (laeuft ? (Date.now() - basisZeit) / 1000 : 0);
    pos = Math.min(pos, liedDauer);
    var regler = el("zeit");
    regler.max = Math.floor(liedDauer);
    regler.value = Math.floor(pos);
    el("pos").textContent = format(pos);
    el("dauer").textContent = format(liedDauer);
  }

  var claudeStand = {};
  var claudeVersatz = 0;
  var claudeListe = "";
  var CLAUDE_TITEL = { arbeitet: "Claude arbeitet", fertig: "Claude ist fertig",
                       wartet: "Claude braucht dich", "": "Claude ruht" };

  function claudeZeigen(c) {
    claudeStand = c;
    claudeVersatz = c.jetzt ? Date.now() - c.jetzt : 0;  // Zeitunterschied zum PC ausgleichen
    var status = c.status || "";

    var banner = el("claude");
    banner.className = status;
    var kopf = c.text || (status === "arbeitet" && c.aktion ? "Claude: " + c.aktion : "");
    banner.textContent = status ? (kopf || CLAUDE_TEXT[status] || status) : "";

    el("claudeview").className = status;
    el("cl-projekt").textContent = c.projekt ? "Projekt: " + c.projekt : "";
    el("cl-titel").textContent = CLAUDE_TITEL[status] || "Claude";
    el("cl-aktion").textContent = status === "wartet" ? (c.text || "") : (c.aktion || "");

    var verlauf = c.verlauf || [];
    var stand = JSON.stringify(verlauf);
    if (stand !== claudeListe) {
      claudeListe = stand;
      var liste = el("cl-verlauf");
      liste.textContent = "";
      verlauf.slice().reverse().slice(0, 7).forEach(function (eintrag) {
        var li = document.createElement("li");
        var uhr = document.createElement("span");
        uhr.className = "uhr";
        uhr.textContent = new Date(eintrag.zeit + claudeVersatz)
          .toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        li.appendChild(uhr);
        li.appendChild(document.createTextNode(eintrag.text));
        liste.appendChild(li);
      });
    }
    claudeZeitAnzeigen();
  }

  function claudeZeitAnzeigen() {
    var c = claudeStand, status = c.status || "";
    var text = "";
    if (status === "arbeitet" || status === "wartet") {
      var sekunden = (Date.now() - claudeVersatz - c.seit) / 1000;
      text = (status === "arbeitet" ? "seit " : "wartet seit ") + format(sekunden);
    } else if (status === "fertig") {
      text = "fertig nach " + format(c.dauer || 0);
    }
    el("cl-zeit").textContent = text;
  }

  var rueckfrageNr = null, rueckfrageBis = 0, rueckfrageGemeldet = null;
  var rueckfrageAktuell = null, rueckfrageErledigt = null;

  function rueckfrageZeigen(r) {
    var box = el("rueckfrage");
    if (!r) { box.style.display = "none"; rueckfrageNr = null; rueckfrageErledigt = null; return; }
    // schon beantwortet oder abgelaufen, der Server hat es nur noch nicht gemeldet
    if (r.bis === rueckfrageErledigt) { box.style.display = "none"; rueckfrageNr = null; return; }
    rueckfrageNr = r.nr;
    rueckfrageAktuell = r.bis;
    var frist = Number(r.bis) - Number(r.jetzt);
    if (isNaN(frist)) frist = 10000;  // fehlende Zeitangabe: Fenster trotzdem zeigen
    rueckfrageBis = Date.now() + frist;  // Frist nach der eigenen Uhr
    el("rf-icon").textContent = r.icon || "\u26A0";
    el("rf-frage").textContent = r.frage || ((r.name || "Aktion") + " wirklich ausf\u00FChren?");
    el("rf-ja").textContent = "Ja";
    box.style.display = "flex";
    rueckfrageZeit();
    // Dem Server einmal melden, dass das Fenster wirklich zu sehen ist (steht dann in /log)
    if (rueckfrageGemeldet !== r.bis) { rueckfrageGemeldet = r.bis; senden("gezeigt:" + r.nr); }
  }

  function rueckfrageZeit() {
    if (rueckfrageNr === null) return;
    var rest = Math.ceil((rueckfrageBis - Date.now()) / 1000);
    if (rest <= 0) { el("rueckfrage").style.display = "none"; rueckfrageNr = null; rueckfrageErledigt = rueckfrageAktuell; return; }
    el("rf-zeit").textContent = "Abbruch in " + rest + " s";
  }

  function rueckfrageAntwort(ja) {
    var nr = rueckfrageNr;
    el("rueckfrage").style.display = "none";
    rueckfrageNr = null;
    rueckfrageErledigt = rueckfrageAktuell;
    senden(ja ? "bestaetigt:" + nr : "abbruch");
  }

  function hinweisZeigen(text, fehler) {
    var h = el("hinweis");
    h.textContent = text;
    h.className = fehler ? "fehler" : "";
    h.style.display = "block";
    clearTimeout(hinweisTimer);
    // laengere Texte bleiben laenger stehen
    hinweisTimer = setTimeout(function () { h.style.display = "none"; }, 2000 + text.length * 40);
  }

  function uhrAktualisieren() {
    var jetzt = new Date();
    el("uhr").textContent = jetzt.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    el("datum").textContent = jetzt.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  }

  var ANSICHTEN = ["musik", "extras", "claude"];
  var ANSICHT_ICON = ["&#9638;", "&#10022;", "&#9835;"];  // zeigt, wohin die Taste als Naechstes wechselt
  var ansichtNr = 0;

  function ansichtSetzen(nr) {
    ansichtNr = nr;
    document.body.classList.toggle("extras", nr === 1);
    document.body.classList.toggle("claudeansicht", nr === 2);
    el("wechsel").innerHTML = ANSICHT_ICON[nr];
    try { localStorage.setItem("phonebox-ansicht", ANSICHTEN[nr]); } catch (e) {}
  }

  function ansichtWechseln() {
    ansichtSetzen((ansichtNr + 1) % ANSICHTEN.length);
  }

  function senden(befehl) {
    if (ws && ws.readyState === 1) ws.send(befehl);
  }

  // Zeitleiste: beim Ziehen nur die Anzeige mitfuehren, beim Loslassen springen
  el("zeit").addEventListener("input", function () {
    zieht = true;
    el("pos").textContent = format(this.value);
  });
  el("zeit").addEventListener("change", function () {
    zieht = false;
    basisPos = Number(this.value);
    basisZeit = Date.now();
    suchenBis = Date.now() + 1500;  // Spotify meldet die neue Position erst etwas spaeter
    senden("suche:" + this.value);
  });

  el("laut").addEventListener("input", function () {
    letzteEingabe = Date.now();
    if (letzteEingabe - letztesSenden > 100) {  // nicht bei jedem Pixel senden
      letztesSenden = letzteEingabe;
      senden("laut:" + this.value);
    }
  });
  el("laut").addEventListener("change", function () {
    letzteEingabe = Date.now();
    senden("laut:" + this.value);  // Endwert immer senden
  });

  try {
    var gemerkt = ANSICHTEN.indexOf(localStorage.getItem("phonebox-ansicht"));
    if (gemerkt > 0) ansichtSetzen(gemerkt);
  } catch (e) {}
  uhrAktualisieren();
  setInterval(uhrAktualisieren, 1000);
  setInterval(zeitAnzeigen, 250);
  setInterval(claudeZeitAnzeigen, 1000);
  setInterval(rueckfrageZeit, 500);
  anmeldungPruefen();
  verbinden();
</script>
</body>
</html>
