<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phonebox</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: #121212; color: #fff;
         font-family: -apple-system, sans-serif; display: flex; flex-direction: column;
         text-align: center; overflow: hidden; }
  #claude { display: none; flex: none; padding: 10px 12px; font-size: 16px; font-weight: bold; }
  #claude.arbeitet { display: block; background: #f5a623; color: #000; }
  #claude.fertig { display: block; background: #1db954; color: #000; }
  #claude.wartet { display: block; background: #3b82f6; color: #fff; }
  #inhalt { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
            gap: 28px; padding: 8px 20px; }
  #info { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #status { color: #1db954; font-size: 14px; margin-bottom: 8px; }
  #cover { width: min(220px, 62vh); height: min(220px, 62vh); border-radius: 8px;
           object-fit: cover; display: none; flex: none; }
  #titel { font-size: 24px; font-weight: bold; max-width: 340px; }
  #kuenstler { font-size: 18px; color: #b3b3b3; margin-top: 4px; min-height: 22px; }
  .tasten { display: flex; gap: 20px; margin-top: 18px; align-items: center; }
  button { width: 68px; height: 68px; border-radius: 50%; border: none;
           background: #282828; color: #fff; font-size: 26px; }
  button:active { background: #1db954; }
  #play { width: 84px; height: 84px; background: #1db954; }
  #lautreihe { display: none; align-items: center; gap: 12px; margin-top: 20px; width: 280px; }
  #laut { flex: 1; accent-color: #1db954; }
  /* Hochformat: alles untereinander */
  @media (orientation: portrait) {
    #inhalt { flex-direction: column; gap: 16px; }
    #cover { width: 200px; height: 200px; }
    button { width: 80px; height: 80px; font-size: 30px; }
    #play { width: 100px; height: 100px; }
    .tasten { gap: 24px; margin-top: 24px; }
    #lautreihe { margin-top: 28px; }
  }
</style>
</head>
<body>
  <div id="claude"></div>
  <div id="inhalt">
    <img id="cover" alt="">
    <div id="info">
      <div id="status">Verbinde ...</div>
      <div id="titel">-</div>
      <div id="kuenstler"></div>
      <div class="tasten">
        <button id="zurueck" onclick="senden('zurueck')">&#9198;</button>
        <button id="play" onclick="senden('playpause')">&#9654;</button>
        <button id="weiter" onclick="senden('weiter')">&#9197;</button>
      </div>
      <div id="lautreihe">
        <span>&#128265;</span>
        <input id="laut" type="range" min="0" max="100" step="1">
        <span>&#128266;</span>
      </div>
    </div>
  </div>
<script>
  var ws;
  var letzteEingabe = 0;
  var letztesSenden = 0;
  var CLAUDE_TEXT = { arbeitet: "Claude arbeitet ...", fertig: "Claude ist fertig", wartet: "Claude braucht dich" };

  function el(id) { return document.getElementById(id); }

  function verbinden() {
    ws = new WebSocket("ws://" + location.host + "/ws");
    ws.onopen = function () {
      el("status").textContent = "Verbunden";
    };
    ws.onmessage = function (e) {
      var d = JSON.parse(e.data);
      el("titel").textContent = d.titel || "-";
      el("kuenstler").textContent = d.kuenstler || "";
      el("play").innerHTML = d.spielt ? "&#9208;" : "&#9654;";

      var cover = el("cover");
      if (d.cover) {
        var neu = "/cover?id=" + d.cover;
        if (cover.getAttribute("src") !== neu) cover.src = neu;
        cover.style.display = "block";
      } else {
        cover.style.display = "none";
        cover.removeAttribute("src");
      }

      var reihe = el("lautreihe");
      if (d.laut === null || d.laut === undefined) {
        reihe.style.display = "none";
      } else {
        reihe.style.display = "flex";
        // Eigene Eingabe nicht sofort ueberschreiben
        if (Date.now() - letzteEingabe > 1500) el("laut").value = d.laut;
      }

      var c = d.claude || {};
      var banner = el("claude");
      banner.className = c.status || "";
      banner.textContent = c.status ? (c.text || CLAUDE_TEXT[c.status] || c.status) : "";
    };
    ws.onclose = function () {
      el("status").textContent = "Warte auf PC ...";
      setTimeout(verbinden, 3000);
    };
  }

  function senden(befehl) {
    if (ws && ws.readyState === 1) ws.send(befehl);
  }

  el("laut").addEventListener("input", function () {
    letzteEingabe = Date.now();
    if (letzteEingabe - letztesSenden > 100) {  // nicht bei jedem Pixel senden
      letztesSenden = letzteEingabe;
      senden("laut:" + this.value);
    }
  });
  el("laut").addEventListener("change", function () {
    letzteEingabe = Date.now();
    senden("laut:" + this.value);  // Endwert immer senden
  });

  verbinden();
</script>
</body>
</html>
